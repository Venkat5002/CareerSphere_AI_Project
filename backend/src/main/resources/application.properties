# ===============================================
# CareerSphere AI - backend configuration
# ===============================================
# PORT is set by hosting services such as Railway; 8080 locally.
server.port=${PORT:8080}

# ---- MySQL (default) ----
# The database is created automatically if it does not exist.
# DB_URL overrides this when deployed (see deploy/DEPLOY.md).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/careersphere?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
# Homebrew's MySQL has no root password by default. If yours has one, set DB_PASSWORD.
spring.datasource.password=${DB_PASSWORD:}

# Hibernate creates/updates tables from the entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ---- JWT ----
# Must be at least 32 characters. Change it for anything beyond local development.
app.jwt.secret=${JWT_SECRET:careersphere-local-dev-secret-change-me-0123456789}
app.jwt.expiration-minutes=480

# ---- Resume uploads ----
app.upload.dir=${UPLOAD_DIR:uploads/resumes}
# Resumes and certificates are limited to 5 MB in code; introduction videos to 25 MB.
spring.servlet.multipart.max-file-size=26MB
spring.servlet.multipart.max-request-size=27MB

# ---- Frontend origin allowed by CORS ----
# Only needed when the web app is served from another address. The single deployed image serves both from one address.
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# ---- Demo data (accounts, skills, sample jobs) ----
app.seed.enabled=${SEED_DEMO_DATA:true}

# ---- Career Copilot (Google Gemini) ----
# Get a free key at https://aistudio.google.com/apikey and start the backend with:
#   GEMINI_API_KEY=your-key mvn spring-boot:run
# Without a key the Copilot still works in offline (rule-based) mode.
app.ai.gemini.api-key=${GEMINI_API_KEY:}
app.ai.gemini.model=${GEMINI_MODEL:gemini-flash-latest}
app.ai.gemini.fallback-model=${GEMINI_FALLBACK_MODEL:gemini-flash-lite-latest}
